<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="./index.js?3"></script>
    <style>
      body {
        overflow: hidden;
      }
      .dot {
        border-radius: 100%;
        border: 1px solid #aaa;
        background-color: #fff;
        position: fixed;
        width: 10px;
        height: 10px;
        transform: translate(-50%, -50%);
      }
      #graph, #overlay {
        max-width: 100vw;
        max-height: 100vh;
        /* image-rendering: pixelated; */
      }
      #overlay {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: -1;
      }
      .frame {
        position: absolute;
        /* border-right: 1px solid #eee; */
        /* box-shadow: 0 0 10px rgba(0, 0, 0, 0.2); */
        /* border-radius: 10px; */
      }
      .label {
        position: absolute;
        font-family: monospace;
        text-align: center;
        background-color: #fff;
        padding-top: 1em;
      }
      .dot.sq {
        border-radius: 0;
        border: none;
        background: none;
        outline: 0.5px solid rgba(0, 0, 0, 0.3);
      }
      #bu_clear {
        position: fixed;
        left: 10px;
        top: 280px;
        z-index: 100;
      }
      #result {
        border: 2px solid red;
        transform: translate(-50%, -50%);
        width: 15px;
        height: 15px;
        position: fixed;
        box-shadow: 10px rgba(0, 0, 0, 1.0);
        border-radius: 100%;
        transition: top 0.5s ease-out, left 0.5s ease-out;
        z-index: 101;
      }
      #result>div {
        position: relative;
        left: 150%;
        top: -1px;
        font-family: Arial;
      }
      #stats {
        position: absolute;
        right: 1em;
        top: 0.5em;
        font-family: monospace;
      }
    </style>
  </head>
  <body style="margin: 0;">
      <canvas id="overlay"></canvas>
      <canvas id="graph"></canvas>
      <div id="stats"></div>
      <canvas id="drawingCanvas" width="256" height="256" style="background-color: #eee; box-shadow: 0 0 20px rgba(0, 0, 0, 0.3); border-radius: 8px; position: fixed; left: 10px; top: 10px; z-index: 100;"></canvas>
      <button id="bu_clear">Clear</button>
      <div id="result"><div>?</div></div>
  </body>
</html>
